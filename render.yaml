# Render Blueprint — deploys the Express API (backend/) on Render's free tier.
# Database lives on Supabase (Postgres). Secrets are entered in the Render
# dashboard (sync: false) and are never committed.
services:
  - type: web
    name: chivon-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DEV_USER_SWITCH
        value: "false"
      # Supabase Session-pooler URI (IPv4, port 5432). Render cannot reach the
      # IPv6-only direct host db.<ref>.supabase.co.
      - key: DATABASE_URL
        sync: false
      # Must be identical to the frontend's AUTH_SECRET (both sign/verify JWTs).
      - key: AUTH_SECRET
        sync: false
      # Comma-separated list of allowed browser origins, e.g.
      # http://localhost:3000,https://crm.chivonmechanical.com
      - key: FRONTEND_ORIGIN
        sync: false
